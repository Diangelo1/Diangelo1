<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
      background-color: #1c2342;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background-color: #1c2342;
      padding: 40px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      width: 300px;
      color: #fff;
    }

    .login-box h2 {
      margin: 0 0 20px;
      border-bottom: 2px solid #fff;
      display: inline-block;
    }

    .login-box label {
      display: block;
      margin: 15px 0 5px;
    }

    .login-box input {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #ccc;
      color: #fff;
      font-size: 14px;
    }

    .login-box button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #c6284e;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box a {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #ccc;
      font-size: 14px;
      text-decoration: none;
    }
    </style>
</head>
<body>
    <div class="login-box">
    <h2>Login</h2>
    <form>
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha">

      <button type="submit">login</button>
      <a href="#">Esqueceu a senha?</a>
    </form>
  </div>
</body>
</html>
