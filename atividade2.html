<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de novos Materias de aula</title>
</head>

<body>
    <form action="">
        <fieldset>
            <h4>Cadastro de novos materias de aula</h4>

            <fieldset>
                <legend>Lista de materias já cadastrados</legend>
                    <nav>
                        <ol>
                            <li>Lápis</li>
                            <li>Caneta</li>
                            <li>Papel</li>
                            <li>Tesoura</li>
                        </ol>
                    </nav>
            </fieldset>

            <fieldset>
                <legend>Cadastrar novo material</legend>
                <nav>
                    <input type="text" placeholder="Nome">
                    <br>
                    <input type="text" placeholder="Preço">
                    <br>
                    <label for="text">Quantidade:</label>
                    <input type="number">
                    <br>
                    <label for="text">Devolução:</label>
                    <input type="radio" name="opcao">Sim
                    <input type="radio" name="opcao">Não
                    <br>
                    <input type="reset" value="Limpar">
                    <input type="submit" value="Cadastrar">
                </nav>
            </fieldset>

            <fieldset>
                <legend>Dados do último material cadastrado</legend>
                <table>
            </fieldset>
        </fieldset>
    </form>
</body>

</html>
