<head>
    <meta charset="UTF-8">

<body>
    <h1>Formulario</h1>

    </nav>

    <main>
        <form action="">
            <fieldset>
                <section style="background-color: rgb(5, 70, 71);">
                    <legend>Formulario</legend>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite o nome..." required>
                    <br>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Digite o email...">
                    <br>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha">
                    <br>
                    <input type="radio" name="frutas">Maça
                    <input type="radio" name="frutas">Banana
                    <input type="radio" name="frutas">Pera
                    <br>
                    <input type="checkbox" name="Netflix">Netflix
                    <input type="checkbox" name="GloboPlay">Globo play
                    <input type="checkbox" name="ApplePlay">Apple play
                    <br>
                    <input type="date">
                    <input type="time">
                    <br>
                    <input type="file">
                    <br>
                    <input type="color">
                    <br>
                    <input type="range">
                    <br>
                    <textarea cols="5" rows="5"></textarea>
                    <br>
                    <select name="selecao">
                        <option value="">Opcao 1</option>
                        <option value="">Opcao 2</option>
                        <option value="">Opcao 3</option>
                    </select>

                    <br>
                    <div style="background-color: rgb(5, 78, 78); text-align: right;">
                        <input type="submit" value="Enviar">
                        <input type="reset">
                    </div>
                </section>
            </fieldset>
        </form>
    </main>
