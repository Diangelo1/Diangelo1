<!DOCTYPE html>
<html>

<head>
    <style>

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            width: 180px;
            /* Alinha os labels à esquerda */
            margin-bottom: 8px;
        }

        input {
            margin-bottom: 8px;
        }

        button {
            display: block;
            margin-top: 10px;
        }

        /* Span em linhas separadas */
        #pagamento {
            display: block;
            margin-top: 10px;
        }
    </style>
    <title>Exercício DOM 3</title>
</head>

<body>
    <h1>Restaurante JS</h1>

    <div class="form- linhas">

        <label for="buffet">Buffet por Quilo R$:</label>
        <input type="number" id="buffet"></input>

        <br>

        <label for="consumo">Consumo do Cliente (gr):</label>
        <input type="number" id="consumo"></input>

        <button id="botao">Calcular Preço</button>

        <span id="pagamento"></span>

    </div>
    <script src="script3.js"></script>
</body>

</html>
