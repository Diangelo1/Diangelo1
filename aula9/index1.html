<!DOCTYPE html>
<html>

<head>
    <style>

        h1 {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            width: 120px;
            /* Alinha os labels à esquerda */
            margin-bottom: 8px;
        }

        input {
            margin-bottom: 8px;
        }

        button {
            display: block;
            margin-top: 10px;
        }

        /* Span em linhas separadas */
        #filme,
        #tempo_de_duracao {
            display: block;
            margin-top: 10px;
        }
    </style>
    <title>Exercício DOM 1</title>
</head>

<body>
    <h1>Vídeo Locadora JS</h1>

    <div class="form- linhas">

        <label for="titulo">Título do Filme:</label>
        <input type="text" id="titulo"></input>

        <br>

        <label for="duracao">Duração (min):</label>
        <input type="number" id="duracao"></input>

        <button id="botao">Converter em Horas e Minutos</button>

        <span id="filme"></span>
        <span id="tempo_de_duracao"></span>

    </div>
    <script src="script1.js"></script>
</body>

</html>
